<!-- ======= mermaid diagram START ======= -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  mermaid.initialize({
    startOnLoad: true,
    theme: 'base',

    themeVariables: {
      /* 전체 */
      background: '#080e14',
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
      fontSize: '15px',

      /* 노드 */
      primaryColor: '#151b23',
      primaryTextColor: '#e6edf3',
      primaryBorderColor: '#30363d',

      secondaryColor: '#1b222c',
      secondaryTextColor: '#e6edf3',
      secondaryBorderColor: '#30363d',

      tertiaryColor: '#111820',
      tertiaryTextColor: '#e6edf3',
      tertiaryBorderColor: '#30363d',

      /* 선 */
      lineColor: '#8b949e',

      /* Flowchart */
      nodeBorder: '#30363d',
      clusterBkg: '#0d131a',
      clusterBorder: '#30363d',

      /* Sequence Diagram */
      actorBkg: '#00284d',
      actorBorder: '#0d3356',
      actorTextColor: '#e6edf3',
      actorLineColor: '#484f58',

      signalColor: '#8b949e',
      signalTextColor: '#e6edf3',

      /* Label */
      labelBackground: '#080e14',

      /* Note */
      noteBkgColor: '#1b222c',
      noteBorderColor: '#30363d',
      noteTextColor: '#e6edf3'
    },

    flowchart: {
      htmlLabels: true,
      curve: 'basis'
    }
  });
</script>

<style>
  .mermaid {
    background-color: #080e14 !important;
    padding: 24px;
    border: 1px solid #202832;
    border-radius: 10px;
    margin: 20px 0;
    display: block;
    overflow-x: auto;
  }

  .mermaid svg {
    max-width: 100% !important;
    height: auto !important;
  }

  .mermaid .nodeLabel,
  .mermaid .label,
  .mermaid text {
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif !important;
  }

  .mermaid .flowchart-link {
    stroke-width: 1.4px;
  }

  .mermaid .node rect,
  .mermaid .node polygon,
  .mermaid .node path {
    rx: 6px;
    ry: 6px;
  }
</style>
<!-- ======= mermaid diagram END ======= -->
